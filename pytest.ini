[pytest]
testpaths = tests
# Fast unit tests by default. Run the others explicitly:
#   pytest -m integration      (real models; downloads on first run)
#   pytest -m hardware         (real webcam/microphone; set INTERVIEW_AI_HARDWARE_TESTS=1)
addopts = -m "not integration and not hardware" -p no:cacheprovider
markers =
    integration: uses real ML models (slow; may download models on first run)
    hardware: uses a real webcam or microphone
filterwarnings =
    ignore::DeprecationWarning
